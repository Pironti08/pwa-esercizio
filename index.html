<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini-Foglio di Calcolo</title>
  <meta name="description" content="Foglio di calcolo 100×100 con formule, installabile e funzionante offline.">
  <meta name="theme-color" content="#2457c5">
  <!-- Tutti i percorsi sono RELATIVI (./...) per funzionare in locale, su GitHub Pages (sottopercorso) e su Vercel -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">
  <header class="toolbar d-flex flex-wrap align-items-center gap-2 px-2 py-2">
    <h1 class="h6 m-0 d-flex align-items-center gap-2">
      <img src="./icons/icon-192.png" width="24" height="24" alt="">Mini-Foglio
    </h1>
    <div class="d-flex flex-wrap gap-1 ms-auto">
      <button id="btn-example" class="btn btn-sm btn-outline-primary" type="button">Esempi</button>
      <button id="btn-perf" class="btn btn-sm btn-outline-primary" type="button">Demo prestazioni</button>
      <button id="btn-csv" class="btn btn-sm btn-outline-primary" type="button">Esporta CSV</button>
      <button id="btn-clear" class="btn btn-sm btn-outline-danger" type="button">Svuota</button>
      <button id="btn-install" class="btn btn-sm btn-primary" type="button" hidden>Installa app</button>
    </div>
  </header>

  <div class="fxbar d-flex align-items-center gap-2 px-2 py-1">
    <input id="namebox" class="form-control form-control-sm namebox" value="A1" readonly aria-label="Cella selezionata">
    <span class="fx-label" aria-hidden="true">fx</span>
    <input id="fx" class="form-control form-control-sm" autocomplete="off" spellcheck="false" aria-label="Barra della formula">
  </div>

  <main class="sheet">
    <div class="corner"></div>
    <div class="colhdr" aria-hidden="true"><div class="inner" id="colhdr-inner"></div></div>
    <div class="rowhdr" aria-hidden="true"><div class="inner" id="rowhdr-inner"></div></div>
    <div class="viewport" id="viewport" tabindex="0" role="grid" aria-rowcount="100" aria-colcount="100"
         aria-label="Griglia di 100 righe per 100 colonne. Frecce per muoverti, Invio o F2 per modificare.">
      <div class="spacer" id="spacer">
        <div class="cells" id="cells"></div>
        <input id="editor" class="editor" hidden autocomplete="off" spellcheck="false" aria-label="Modifica la cella">
      </div>
    </div>
  </main>

  <footer class="statusbar d-flex flex-wrap align-items-center gap-2 px-2 py-1">
    <span id="status" aria-live="polite">Pronto</span>
    <span id="perf" class="text-secondary ms-auto"></span>
    <span id="net" class="badge text-bg-secondary">Online</span>
  </footer>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
